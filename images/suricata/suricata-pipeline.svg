<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 330" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1480" height="330" fill="#fcfcfb" rx="0"/><filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b0b0b" flood-opacity="0.18"/></filter><text x="740.0" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#0b0b0b">Suricata 数据包流水线总览</text><text x="740.0" y="82" text-anchor="middle" font-size="15" fill="#52514e">一个包从网卡钻进来，依次经过这几道工位，最后变成一条 EVE JSON 告警</text><rect x="40" y="150" width="120" height="100" rx="14" fill="#e1e0d9" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="100.0" y="194.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">网卡</text><text x="100.0" y="218.0" text-anchor="middle" font-size="12.5" fill="#0b0b0b" opacity="1">PCAP 文件</text><line x1="160" y1="200.0" x2="180" y2="200.0" stroke="#898781" stroke-width="2.5"/><polygon points="180,194.0 188,200.0 180,206.0" fill="#898781"/><rect x="188" y="150" width="150" height="100" rx="14" fill="#6da7ec" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="263.0" y="194.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">捕获</text><text x="263.0" y="218.0" text-anchor="middle" font-size="12.5" fill="#0b0b0b" opacity="1">AF_PACKET / PCAP / NFQ</text><text x="263.0" y="272" text-anchor="middle" font-size="12" fill="#898781">第3篇</text><line x1="338" y1="200.0" x2="358" y2="200.0" stroke="#898781" stroke-width="2.5"/><polygon points="358,194.0 366,200.0 358,206.0" fill="#898781"/><rect x="366" y="150" width="150" height="100" rx="14" fill="#5598e7" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="441.0" y="194.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">解码</text><text x="441.0" y="218.0" text-anchor="middle" font-size="12.5" fill="#0b0b0b" opacity="1">Ether / IP / TCP</text><text x="441.0" y="272" text-anchor="middle" font-size="12" fill="#898781">第4篇</text><line x1="516" y1="200.0" x2="536" y2="200.0" stroke="#898781" stroke-width="2.5"/><polygon points="536,194.0 544,200.0 536,206.0" fill="#898781"/><rect x="544" y="150" width="150" height="100" rx="14" fill="#3987e5" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="619.0" y="194.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Flow</text><text x="619.0" y="218.0" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="1">查找 / 建立</text><text x="619.0" y="272" text-anchor="middle" font-size="12" fill="#898781">第5篇</text><line x1="694" y1="200.0" x2="714" y2="200.0" stroke="#898781" stroke-width="2.5"/><polygon points="714,194.0 722,200.0 714,206.0" fill="#898781"/><rect x="722" y="150" width="150" height="100" rx="14" fill="#2a78d6" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="797.0" y="194.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Stream</text><text x="797.0" y="218.0" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="1">TCP 重组</text><text x="797.0" y="272" text-anchor="middle" font-size="12" fill="#898781">第6篇</text><line x1="872" y1="200.0" x2="892" y2="200.0" stroke="#898781" stroke-width="2.5"/><polygon points="892,194.0 900,200.0 892,206.0" fill="#898781"/><rect x="900" y="150" width="150" height="100" rx="14" fill="#256abf" stroke="rgba(11,11,11,0.08)" stroke-width="1" filter="url(#softshadow)"/><text x="975.0" y="194.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">应用层解析</text><text x="975.0" y="218.0" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="1">HTTP / TLS ...</text><text x="975.0" y="272" text-anchor="middle" font-size="12" fill="#898781">第7篇</text><line x1="1050" y1="200.0" x2="1070" y2="200.0" stroke="#898781" stroke-