<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PacketFlow Lab · 网络数据包流转与状态演化</title>
  <style>
    :root {
      --bg-page: #FFFFFF;
      --bg-stage: #FFFFFF;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-terminal: #FAFBFD;
      --border: #E5E7EB;
      --border-strong: #CBD5E1;

      --text-primary: #141B29;
      --text-secondary: #4B5565;
      --text-tertiary: #687385;

      --sapphire: #2563EB;
      --sapphire-bg: #EFF6FF;
      --sapphire-border: #BFDBFE;

      --teal: #0D9488;
      --teal-bg: #F0FDFA;
      --teal-border: #99F6E4;

      --amber: #B45309;
      --amber-accent: #D97706;
      --amber-bg: #FFFBEB;
      --amber-border: #FDE68A;

      --indigo: #4F46E5;
      --indigo-bg: #EEF2FF;
      --indigo-border: #C7D2FE;

      --crimson: #DC2626;
      --crimson-bg: #FEF2F2;
      --crimson-border: #FECACA;

      --shadow-card: 0 10px 28px -14px rgba(20, 27, 41, 0.09), 0 1px 3px rgba(20, 27, 41, 0.04);
      --shadow-pill: 0 2px 8px -2px rgba(20, 27, 41, 0.08);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;

      --font-sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    ::selection {
      background: rgba(37, 99, 235, 0.16);
      color: var(--text-primary);
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #CBD5E1 transparent;
    }
    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 999px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .mono, .tabular {
      font-variant-numeric: tabular-nums;
    }
    .mono {
      font-family: var(--font-mono);
    }

    button:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--sapphire);
      outline-offset: 2px;
    }

    .app-shell {
      max-width: 1360px;
      margin: 0 auto;
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100vh;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px 16px;
      box-shadow: var(--shadow-card);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--text-primary);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin: 0;
      white-space: nowrap;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-left: 8px;
      padding-left: 10px;
      border-left: 1px solid var(--border);
      white-space: nowrap;
    }

    .scene-switcher {
      display: inline-flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .scene-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 13px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      white-space: nowrap;
    }

    .scene-btn:hover:not(.active) {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.55);
    }

    .scene-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      font-weight: 600;
      border-color: var(--border);
      box-shadow: var(--shadow-pill);
    }

    .scene-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--sapphire);
      flex-shrink: 0;
    }
    .scene-btn[data-scene="docker-tls-rst"] .scene-dot {
      background: var(--crimson);
    }

    .topbar-hints {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
    }

    /* Main Workspace Grid */
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.68fr) minmax(330px, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Left Stage */
    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
    }

    .stage-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .stage-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .legend-swatch {
      width: 8px;
      height: 8px;
      border-radius: 999px;
    }

    .canvas-wrap {
      position: relative;
      background-color: var(--bg-stage);
      background-image: radial-gradient(rgba(20, 27, 41, 0.085) 1px, transparent 1px);
      background-size: 20px 20px;
      border-bottom: 1px solid var(--border);
      padding: 8px 10px 6px;
    }

    #topoSvg {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      overflow: visible;
    }

    .node-group {
      cursor: pointer;
      transition: opacity 200ms ease;
    }
    .node-card {
      transition: stroke 180ms ease, fill 180ms ease, filter 180ms ease;
    }
    .node-group:hover .node-card {
      stroke: var(--sapphire);
      stroke-width: 1.75;
    }

    /* Node inspection floating popover inside canvas */
    .node-popover {
      position: absolute;
      left: 14px;
      bottom: 12px;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      box-shadow: 0 12px 26px -10px rgba(20, 27, 41, 0.16);
      display: none;
      gap: 8px;
      align-items: flex-start;
      z-index: 4;
      animation: popIn 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .node-popover.open {
      display: flex;
    }
    .node-popover-body {
      flex: 1;
      min-width: 0;
    }
    .node-popover-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .node-popover-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.45;
    }
    .node-popover-close {
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      display: grid;
      place-items: center;
    }
    .node-popover-close:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Narrative Banner */
    .narrative-bar {
      padding: 13px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      min-height: 78px;
    }

    .step-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--sapphire-border);
      background: var(--sapphire-bg);
      color: var(--sapphire);
      white-space: nowrap;
      margin-top: 1px;
      flex-shrink: 0;
    }
    .step-pill.tone-teal {
      background: var(--teal-bg);
      border-color: var(--teal-border);
      color: var(--teal);
    }
    .step-pill.tone-amber {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber);
    }
    .step-pill.tone-indigo {
      background: var(--indigo-bg);
      border-color: var(--indigo-border);
      color: var(--indigo);
    }
    .step-pill.tone-crimson {
      background: var(--crimson-bg);
      border-color: var(--crimson-border);
      color: var(--crimson);
    }

    .narrative-content {
      flex: 1;
      min-width: 0;
    }
    .narrative-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 3px;
    }
    .narrative-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.5;
    }

    /* Playback Controls */
    .controls-bar {
      padding: 10px 16px 12px;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      height: 32px;
      padding: 0 11px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 140ms ease, border-color 140ms ease, transform 100ms ease;
    }
    .ctrl-btn:hover:not(:disabled) {
      background: var(--bg-subtle);
      border-color: var(--border-strong);
    }
    .ctrl-btn:active:not(:disabled) {
      transform: translateY(0.5px);
    }
    .ctrl-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .ctrl-btn.primary {
      background: var(--text-primary);
      border-color: var(--text-primary);
      color: #FFFFFF;
      font-weight: 600;
      padding: 0 14px;
    }
    .ctrl-btn.primary:hover:not(:disabled) {
      background: #232D42;
      border-color: #232D42;
    }

    .speed-group {
      display: inline-flex;
      align-items: center;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .speed-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease;
    }
    .speed-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(20, 27, 41, 0.08);
    }

    /* Segmented Scrubber */
    .scrubber {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 5px;
      align-items: center;
    }

    .scrub-seg {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-tertiary);
      transition: all 160ms ease;
      padding: 0;
    }
    .scrub-seg:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
      background: #E2E8F0;
    }
    .scrub-seg.visited {
      background: var(--sapphire-bg);
      border-color: var(--sapphire-border);
      color: var(--sapphire);
    }
    .scrub-seg.visited.tone-teal {
      background: var(--teal-bg);
      border-color: var(--teal-border);
      color: var(--teal);
    }
    .scrub-seg.visited.tone-crimson {
      background: var(--crimson-bg);
      border-color: var(--crimson-border);
      color: var(--crimson);
    }
    .scrub-seg.active {
      background: var(--sapphire);
      border-color: var(--sapphire);
      color: #FFFFFF;
      font-weight: 700;
      box-shadow: 0 2px 6px -1px rgba(37, 99, 235, 0.35);
    }
    .scrub-seg.active.tone-teal {
      background: var(--teal);
      border-color: var(--teal);
      box-shadow: 0 2px 6px -1px rgba(13, 148, 136, 0.35);
    }
    .scrub-seg.active.tone-amber {
      background: var(--amber-accent);
      border-color: var(--amber-accent);
      box-shadow: 0 2px 6px -1px rgba(217, 119, 6, 0.35);
    }
    .scrub-seg.active.tone-indigo {
      background: var(--indigo);
      border-color: var(--indigo);
      box-shadow: 0 2px 6px -1px rgba(79, 70, 229, 0.35);
    }
    .scrub-seg.active.tone-crimson {
      background: var(--crimson);
      border-color: var(--crimson);
      box-shadow: 0 2px 6px -1px rgba(220, 38, 38, 0.35);
    }

    /* Right Inspector */
    .inspector-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .inspector-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }

    .proto-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--sapphire-border);
      background: var(--sapphire-bg);
      color: var(--sapphire);
    }
    .proto-badge.tone-teal {
      background: var(--teal-bg);
      border-color: var(--teal-border);
      color: var(--teal);
    }
    .proto-badge.tone-amber {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber);
    }
    .proto-badge.tone-indigo {
      background: var(--indigo-bg);
      border-color: var(--indigo-border);
      color: var(--indigo);
    }
    .proto-badge.tone-crimson {
      background: var(--crimson-bg);
      border-color: var(--crimson-border);
      color: var(--crimson);
    }

    .inspector-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
    }

    .layer-block {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      overflow: hidden;
    }

    .layer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .layer-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-tertiary);
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr;
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid #F1F5F9;
      font-size: 12.5px;
      transition: background 240ms ease;
    }
    .field-row:last-child {
      border-bottom: none;
    }

    .field-row.changed {
      background: var(--amber-bg);
      animation: diffPulse 720ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .field-row.alert {
      background: var(--crimson-bg);
      animation: alertPulse 720ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes diffPulse {
      0% { background: #FDE68A; }
      100% { background: var(--amber-bg); }
    }
    @keyframes alertPulse {
      0% { background: #FECACA; }
      100% { background: var(--crimson-bg); }
    }

    .field-name {
      color: var(--text-tertiary);
      font-size: 12px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .field-val-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      text-align: right;
    }

    .field-val {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .field-old {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-tertiary);
      text-decoration: line-through;
    }

    .field-arrow {
      font-size: 11px;
      color: var(--amber);
      font-weight: 600;
    }

    .diff-chip {
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 999px;
      background: #FEF3C7;
      border: 1px solid var(--amber-border);
      color: var(--amber);
      white-space: nowrap;
    }

    .alert-chip {
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 999px;
      background: #FEE2E2;
      border: 1px solid var(--crimson-border);
      color: var(--crimson);
      white-space: nowrap;
    }

    .keep-chip {
      font-size: 10.5px;
      font-weight: 500;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    /* Fingerprint Comparison Card in Step 10 of Scene 2 */
    .compare-box {
      border: 1px solid var(--crimson-border);
      background: var(--crimson-bg);
      border-radius: var(--radius-md);
      padding: 10px;
    }
    .compare-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--crimson);
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      background: var(--bg-surface);
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .compare-table th,
    .compare-table td {
      padding: 5px 8px;
      border-bottom: 1px solid #F1F5F9;
      text-align: left;
    }
    .compare-table tr:last-child td {
      border-bottom: none;
    }
    .compare-table th {
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 11px;
    }
    .compare-table td.mono {
      font-size: 11.5px;
    }
    .compare-real {
      color: var(--teal);
      font-weight: 600;
    }
    .compare-fake {
      color: var(--crimson);
      font-weight: 600;
    }

    /* Bottom tcpdump strip */
    .tcpdump-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .tcpdump-head {
      padding: 9px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-surface);
    }

    .tcpdump-head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .tcpdump-hint {
      font-size: 11.5px;
      color: var(--text-tertiary);
    }

    .tcpdump-list {
      position: relative;
      background: var(--bg-terminal);
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 174px;
      overflow-y: auto;
    }

    .dump-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 5px 9px;
      border-radius: 7px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
      text-align: left;
      width: 100%;
      background: transparent;
      font-family: var(--font-sans);
    }
    .dump-line:hover {
      background: rgba(20, 27, 41, 0.035);
    }
    .dump-line.active {
      background: var(--sapphire-bg);
      border-color: var(--sapphire-border);
    }
    .dump-line.active.tone-teal {
      background: var(--teal-bg);
      border-color: var(--teal-border);
    }
    .dump-line.active.tone-amber {
      background: var(--amber-bg);
      border-color: var(--amber-border);
    }
    .dump-line.active.tone-indigo {
      background: var(--indigo-bg);
      border-color: var(--indigo-border);
    }
    .dump-line.active.tone-crimson {
      background: var(--crimson-bg);
      border-color: var(--crimson-border);
    }
    .dump-line.future {
      opacity: 0.42;
    }

    .dump-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--border-strong);
      flex-shrink: 0;
      transform: translateY(-1px);
    }
    .dump-line.active .dump-dot {
      background: var(--sapphire);
    }
    .dump-line.active.tone-teal .dump-dot { background: var(--teal); }
    .dump-line.active.tone-amber .dump-dot { background: var(--amber-accent); }
    .dump-line.active.tone-indigo .dump-dot { background: var(--indigo); }
    .dump-line.active.tone-crimson .dump-dot { background: var(--crimson); }

    .dump-probe {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dump-text {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* SVG link dashes animation */
    @keyframes dashFlow {
      to { stroke-dashoffset: -24; }
    }
    .link-active-flow {
      stroke-dasharray: 6 6;
      animation: dashFlow 0.85s linear infinite;
    }

    /* Responsive adjustments for Hexo blog iframes & mobile */
    @media (max-width: 980px) {
      .workspace {
        grid-template-columns: 1fr;
      }
      .topbar-hints {
        display: none;
      }
      .brand-sub {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        padding: 10px 10px 18px;
        gap: 10px;
      }
      .scene-btn {
        font-size: 12px;
        padding: 5px 9px;
      }
      .stage-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .scrubber {
        gap: 3px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .link-active-flow,
      .field-row.changed,
      .field-row.alert {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">

      <nav class="scene-switcher" aria-label="拓扑场景切换">
        <button type="button" class="scene-btn active" data-scene="routed">
          <span class="scene-dot"></span>
          <span>1. 跨多跳网关转发</span>
        </button>
        <button type="button" class="scene-btn" data-scene="docker-tls-rst">
          <span class="scene-dot"></span>
          <span>2. Docker SNAT &amp; 伪造 RST</span>
        </button>
      </nav>

      <div class="topbar-hints" aria-label="快捷键提示">
        <span><span class="kbd">Space</span> 播放/暂停</span>
        <span><span class="kbd">←</span><span class="kbd">→</span> 单步</span>
      </div>
    </header>

    <!-- Main 2-Column Workspace -->
    <main class="workspace">
      <!-- Left: Topology Stage + Narrative + Controls -->
      <section class="panel" aria-label="拓扑动画舞台">
        <div class="stage-header">

            <span class="legend-item"><span class="legend-swatch" style="background: var(--amber-accent);"></span>字段改写</span>
            <span class="legend-item" id="legendAlert" style="display:none;"><span class="legend-swatch" style="background: var(--crimson);"></span>伪造 RST</span>
          </div>
        </div>

        <div class="canvas-wrap">
          <svg id="topoSvg" viewBox="0 0 860 370" role="img" aria-label="网络拓扑与数据包流转动画">

            <g id="layerLinks"></g>
            <g id="layerNodes"></g>

          </svg>

          <div class="node-popover" id="nodePopover" role="dialog" aria-label="节点设备详情">

              <p class="node-popover-desc" id="nodePopoverDesc"></p>

            <button type="button" class="node-popover-close" id="nodePopoverClose" aria-label="关闭节点详情">

              </svg>
            </button>
          </div>
        </div>

        <div class="narrative-bar">
          <span class="step-pill tabular" id="stepBadge">步骤 1 / 10</span>
          <div class="narrative-content">
            <div class="narrative-title" id="stepTitle">Host A 构造 TCP SYN</div>
            <p class="narrative-desc" id="stepDesc"></p>
          </div>
        </div>

        <div class="controls-bar">
          <div class="controls-row">
            <div class="btn-group">
              <button type="button" class="ctrl-btn primary" id="btnPlay">

                  <polygon points="6 4 20 12 6 20 6 4"></polygon>
                </svg>
                <span id="playLabel">播放</span>
              </button>
              <button type="button" class="ctrl-btn" id="btnPrev" title="上一步 (←)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m15 18-6-6 6-6"></path>
                </svg>
                <span>上一步</span>
              </button>
              <button type="button" class="ctrl-btn" id="btnNext" title="下一步 (→)">
                <span>下一步</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m9 18 6-6-6-6"></path>
                </svg>
              </button>
              <button type="button" class="ctrl-btn" id="btnReplay" title="重播当前拓扑">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
                <span>重播</span>
              </button>
            </div>

            <div class="speed-group" role="group" aria-label="动画倍速">
              <button type="button" class="speed-btn" data-speed="0.7">0.7x</button>
              <button type="button" class="speed-btn active" data-speed="1">1x</button>
              <button type="button" class="speed-btn" data-speed="1.5">1.5x</button>
            </div>
          </div>

          <div class="scrubber" id="scrubber" role="tablist" aria-label="步骤进度条"></div>
        </div>
      </section>

      <!-- Right: Live Packet Header Inspector -->
      <aside class="panel" aria-label="实时包头字段检查器">
        <div class="inspector-header">
          <h2 class="inspector-title">数据包头实时检查</h2>
          <span class="proto-badge" id="protoBadge">TCP SYN</span>
        </div>
        <div class="inspector-body" id="inspectorBody"></div>
      </aside>
    </main>

    <!-- Bottom: Step-Synced tcpdump Strip -->
    <section class="tcpdump-panel" aria-label="同步 tcpdump 抓包视图">
      <div class="tcpdump-head">
        <div class="tcpdump-head-left">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
          <span>同步 tcpdump 抓包记录</span>
        </div>
        <span class="tcpdump-hint">点击任意抓包行可直接跳转到对应步骤</span>
      </div>
      <div class="tcpdump-list" id="tcpdumpList"></div>
    </section>
  </div>

      };

      function svgEl(tag, attrs = {}) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) {
          el.setAttribute(k, String(v));
        }
        return el;
      }

      function getScene() {
        return SCENES[state.sceneId];
      }

      function findNode(id) {
        return getScene().nodes.find(n => n.id === id);
      }

      function closePopover() {
        els.nodePopover.classList.remove("open");
      }

      function openNodePopover(node) {
        els.nodePopoverTitle.textContent = `${node.label}（${node.sub}）`;
        els.nodePopoverDesc.textContent = node.detail;
        els.nodePopover.classList.add("open");
      }

      function measureLabelWidth(str, asciiW = 6.6, cjkW = 10.8) {
        let total = 0;
        for (const ch of str) {
          total += ch.charCodeAt(0) > 127 ? cjkW : asciiW;
        }
        return total;
      }

      function renderTopologyBase() {
        const scene = getScene();
        els.stageTitle.textContent = scene.title;
        els.legendAlert.style.display = scene.hasAlert ? "inline-flex" : "none";
        closePopover();

        // Zones
        els.layerZones.innerHTML = "";
        for (const z of scene.zones) {
          const g = svgEl("g");
          g.appendChild(svgEl("rect", {
            x: z.x, y: z.y, width: z.w, height: z.h, rx: 12,
            fill: z.bg, "fill-opacity": 0.45,
            stroke: z.border, "stroke-width": 1.25, "stroke-dasharray": "5 4"
          }));
          const pillW = Math.min(z.w - 14, Math.ceil(measureLabelWidth(z.label, 6.4, 10.2) + 18));
          g.appendChild(svgEl("rect", {
            x: z.x + 8, y: z.y + 8, width: pillW, height: 21, rx: 6,

          }));
          const txt = svgEl("text", {
            x: z.x + 16, y: z.y + 22,
            fill: z.text, "font-size": 10.5, "font-weight": 600,

          });
          txt.textContent = z.label;
          g.appendChild(txt);
          els.layerZones.appendChild(g);
        }

        // Links
        els.layerLinks.innerHTML = "";
        for (const lk of scene.links) {
          const a = findNode(lk.from);
          const b = findNode(lk.to);
          const g = svgEl("g", { "data-link": `${lk.from}-${lk.to}` });

          const lineAttrs = {
            x1: a.x, y1: a.y, x2: b.x, y2: b.y,

          };
          if (lk.dashed) {
            lineAttrs["stroke-dasharray"] = "5 5";
          }
          g.appendChild(svgEl("line", lineAttrs));

          // Active overlay line (initially hidden)
          g.appendChild(svgEl("line", {
            class: "link-overlay",

            stroke: "transparent", "stroke-width": 3.5, "stroke-linecap": "round"
          }));

          // Link label pill

          const isVertical = Math.abs(a.x - b.x) < 10;
          const lx = isVertical ? mx + 46 : mx;
          const ly = isVertical ? my + 24 : my - 16;
          const lw = Math.ceil(measureLabelWidth(lk.label, 6.4, 10.2) + 18);

          g.appendChild(svgEl("rect", {
            x: lx - lw / 2, y: ly - 10, width: lw, height: 19, rx: 9.5,

          els.layerLinks.appendChild(g);

        // Nodes
        els.layerNodes.innerHTML = "";
        for (const n of scene.nodes) {

          });

          g.appendChild(svgEl("rect", {
            class: "node-card",
            x: -27, y: -27, width: 54, height: 54, rx: 13,
            fill: isAlertNode ? "#FEF2F2" : "#FFFFFF",

          const iconG = svgEl("g", {
            transform: "translate(-12, -12)",
            fill: "none",
            stroke: isAlertNode ? "#DC2626" : "#141B29",
            "stroke-width": 1.75,
            "stroke-linecap": "round",
            "stroke-linejoin": "round"
          });
          iconG.innerHTML = ICON_PATHS[n.type] || ICON_PATHS.host;
          g.appendChild(iconG);

          // Label below node
          const labelY = 44;
          const title = svgEl("text", {
            x: 0, y: labelY, "text-anchor": "middle",

          const sub = svgEl("text", {
            x: 0, y: labelY + 16, "text-anchor": "middle",

            mac.textContent = n.mac;

          g.addEventListener("click", () => openNodePopover(n));

      function renderScrubber() {
        const scene = getScene();

        scene.steps.forEach((st, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";

          btn.textContent = String(idx + 1);
          btn.title = `步骤 ${idx + 1}: ${st.title}`;
          btn.addEventListener("click", () => {
            stopAutoPlay();
            goToStep(idx, true);
          });
          els.scrubber.appendChild(btn);
        });

      function updateScrubberState() {
        const scene = getScene();
        const segs = els.scrubber.querySelectorAll(".scrub-seg");
        segs.forEach((seg, idx) => {
          const st = scene.steps[idx];
          seg.className = `scrub-seg tabular tone-${st.tone}`;
          if (idx < state.stepIdx) seg.classList.add("visited");
          if (idx === state.stepIdx) seg.classList.add("active");

      function updateTcpdumpHighlight() {
        const lines = els.tcpdumpList.querySelectorAll(".dump-line");
        lines.forEach((line, idx) => {
          line.classList.toggle("active", idx === state.stepIdx);

            const list = els.tcpdumpList;
            const targetTop = line.offsetTop - (list.clientHeight - line.clientHeight) / 2;
            list.scrollTop = Math.max(0, targetTop);

        });

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderInspector(step) {
        const diffs = step.diffs || {};
        const alerts = new Set(step.alerts || []);

        function rowHtml(key, label, value) {
          const diff = diffs[key];
          const isAlert = alerts.has(key);
          const isChanged = diff && diff.old !== undefined;
          const rowClass = isAlert ? "field-row alert" : (isChanged ? "field-row changed" : "field-row");

          let valHtml = `<span class="field-val">${escapeHtml(value)}</span>`;
          if (isChanged) {
            valHtml = `
              <span class="field-old">${escapeHtml(diff.old)}</span>
              <span class="field-arrow">→</span>
              <span class="field-val">${escapeHtml(value)}</span>
              <span class="diff-chip">${escapeHtml(diff.tag)}</span>
            `;
          } else if (diff && diff.keep) {
            valHtml = `
              <span class="field-val">${escapeHtml(value)}</span>
              <span class="keep-chip">${escapeHtml(diff.keep)}</span>

      function highlightLinkPath(fromId, toId, tone) {
        const scene = getScene();
        const strokeColor = (TONE_MAP[tone] || TONE_MAP.sapphire).stroke;
        // Reset all link overlays
        els.layerLinks.querySelectorAll(".link-overlay").forEach(el => {
          el.setAttribute("stroke", "transparent");
          el.classList.remove("link-active-flow");
        });

        if (fromId === toId) return;

        // Find node indices along main horizontal axis or direct link
        const orderedIds = scene.nodes.filter(n => n.type !== "middlebox").map(n => n.id);
        const idxA = orderedIds.indexOf(fromId);
        const idxB = orderedIds.indexOf(toId);

        const activeSegments = [];
        if (idxA !== -1 && idxB !== -1) {
          const dir = idxB > idxA ? 1 : -1;
          for (let i = idxA; i !== idxB; i += dir) {
            activeSegments.push([orderedIds[i], orderedIds[i + dir]]);
          }
        } else {
          // Involves middlebox
          if (fromId === "middlebox" && toId !== "gw1") {
            activeSegments.push(["middlebox", "gw1"]);
            const idxTarget = orderedIds.indexOf(toId);
            const idxGw1 = orderedIds.indexOf("gw1");
            const dir = idxTarget > idxGw1 ? 1 : -1;
            for (let i = idxGw1; i !== idxTarget; i += dir) {
              activeSegments.push([orderedIds[i], orderedIds[i + dir]]);
            }
          } else {
            activeSegments.push([fromId, toId]);
          }
        }

        activeSegments.forEach(([u, v]) => {
          const selector1 = `[data-link="${u}-${v}"] .link-overlay`;
          const selector2 = `[data-link="${v}-${u}"] .link-overlay`;
          const overlay = els.layerLinks.querySelector(selector1) || els.layerLinks.querySelector(selector2);
          if (overlay) {
            overlay.setAttribute("stroke", strokeColor);
            overlay.classList.add("link-active-flow");
          }
        });
      }

      function buildWaypoints(fromId, toId) {
        const scene = getScene();
        const orderedIds = scene.nodes.filter(n => n.type !== "middlebox").map(n => n.id);
        const pts = [];

        if (fromId === toId) {
          const n = findNode(fromId);
          return [{ x: n.x, y: n.y }];
        }

        if (fromId === "middlebox" && toId !== "gw1") {
          pts.push(findNode("middlebox"));
          pts.push(findNode("gw1"));
          const idxGw1 = orderedIds.indexOf("gw1");
          const idxTarget = orderedIds.indexOf(toId);
          const dir = idxTarget > idxGw1 ? 1 : -1;
          for (let i = idxGw1 + dir; i !== idxTarget + dir; i += dir) {
            pts.push(findNode(orderedIds[i]));
          }
          return pts.map(n => ({ x: n.x, y: n.y }));
        }

        const idxA = orderedIds.indexOf(fromId);
        const idxB = orderedIds.indexOf(toId);
        if (idxA !== -1 && idxB !== -1) {
          const dir = idxB > idxA ? 1 : -1;
          for (let i = idxA; i !== idxB + dir; i += dir) {
            pts.push(findNode(orderedIds[i]));
          }
          return pts.map(n => ({ x: n.x, y: n.y }));
        }

        return [findNode(fromId), findNode(toId)].map(n => ({ x: n.x, y: n.y }));
      }

      function interpolateWaypoints(pts, t) {
        if (pts.length === 1) return pts[0];
        let total = 0;
        const segLens = [];
        for (let i = 0; i < pts.length - 1; i++) {
          const dx = pts[i + 1].x - pts[i].x;
          const dy = pts[i + 1].y - pts[i].y;
          const len = Math.hypot(dx, dy);
          segLens.push(len);
          total += len;
        }
        let target = total * t;
        for (let i = 0; i < segLens.length; i++) {
          if (target <= segLens[i] || i === segLens.length - 1) {
            const localT = segLens[i] === 0 ? 0 : target / segLens[i];
            return {
              x: pts[i].x + (pts[i + 1].x - pts[i].x) * localT,
              y: pts[i].y + (pts[i + 1].y - pts[i].y) * localT
            };
          }
          target -= segLens[i];
        }
        return pts[pts.length - 1];
      }

      function createCapsuleGroup(label, tone, faded = false) {
        const theme = TONE_MAP[tone] || TONE_MAP.sapphire;
        const textW = measureLabelWidth(label, 6.6, 10.6);
        const w = Math.max(96, Math.ceil(textW + 32));
        const g = svgEl("g", {
          opacity: faded ? 0.56 : 1,
          filter: faded ? "" : "url(#capsuleShadow)"
        });
        g.appendChild(svgEl("rect", {
          x: -w / 2, y: -13, width: w, height: 26, rx: 13,
          fill: "#FFFFFF", stroke: theme.stroke, "stroke-width": 1.8
        }));
        g.appendChild(svgEl("circle", {
          cx: -w / 2 + 12, cy: 0, r: 3.5, fill: theme.stroke
        }));
        const txt = svgEl("text", {
          x: 6, y: 3.8, "text-anchor": "middle",
          fill: theme.text, "font-size": 10.5, "font-weight": 600,
          "font-family": "var(--font-mono)"
        });
        txt.textContent = label;
        g.appendChild(txt);
        return g;
      }

      function triggerArrivalPulse(nodeId, tone) {
        const n = findNode(nodeId);
        if (!n) return;
        const theme = TONE_MAP[tone] || TONE_MAP.sapphire;
        els.layerPulse.innerHTML = "";

        const ring = svgEl("rect", {
          x: n.x - 27, y: n.y - 27, width: 54, height: 54, rx: 13,
          fill: "none", stroke: theme.stroke, "stroke-width": 2.4, opacity: 0.9
        });
        els.layerPulse.appendChild(ring);

        // Animate expansion via rAF
        const start = performance.now();
        const dur = 620;
        function stepPulse(now) {
          const p = Math.min(1, (now - start) / dur);
          const ease = 1 - Math.pow(1 - p, 3);
          const expand = ease * 15;
          ring.setAttribute("x", String(n.x - 27 - expand));
          ring.setAttribute("y", String(n.y - 27 - expand));
          ring.setAttribute("width", String(54 + expand * 2));
          ring.setAttribute("height", String(54 + expand * 2));
          ring.setAttribute("rx", String(13 + expand * 0.4));
          ring.setAttribute("opacity", String((1 - p) * 0.85));
          if (p < 1) {
            requestAnimationFrame(stepPulse);
          } else {
            ring.remove();
          }
        }
        requestAnimationFrame(stepPulse);
      }

      function highlightActiveNode(nodeId, tone) {
        const scene = getScene();
        const theme = TONE_MAP[tone] || TONE_MAP.sapphire;
        els.layerNodes.querySelectorAll(".node-group").forEach(g => {
          const id = g.getAttribute("data-node");
          const card = g.querySelector(".node-card");
          const isAlert = id === "middlebox";
          if (id === nodeId) {
            card.setAttribute("stroke", theme.stroke);
            card.setAttribute("stroke-width", "2.4");
            card.setAttribute("fill", theme.fill);
          } else {
            card.setAttribute("stroke", isAlert ? "#FCA5A5" : "#CBD5E1");
            card.setAttribute("stroke-width", "1.4");
            card.setAttribute("fill", isAlert ? "#FEF2F2" : "#FFFFFF");
          }
        });
      }

      function animatePacketForStep(step, instantEnd = false) {
        if (state.rafId) {
          cancelAnimationFrame(state.rafId);
          state.rafId = null;
        }
        els.layerPackets.innerHTML = "";

        const primaryPts = buildWaypoints(step.from, step.to);
        const capPrimary = createCapsuleGroup(step.capsule, step.tone, false);
        els.layerPackets.appendChild(capPrimary);

        let capSecondary = null;
        let secPts = null;
        if (step.secondaryFrom && step.secondaryTo) {
          secPts = buildWaypoints(step.secondaryFrom, step.secondaryTo);
          capSecondary = createCapsuleGroup(step.secondaryLabel || "原包", "indigo", true);
          els.layerPackets.appendChild(capSecondary);
        }

        const placeAt = (progress) => {
          const ease = progress < 0.5
            ? 4 * progress * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 3) / 2;

          if (primaryPts.length === 1) {
            const p = primaryPts[0];
            const bob = Math.sin(progress * Math.PI) * -6;
            capPrimary.setAttribute("transform", `translate(${p.x}, ${p.y - 40 + bob})`);
          } else {
            const pos = interpolateWaypoints(primaryPts, ease);
            capPrimary.setAttribute("transform", `translate(${pos.x}, ${pos.y - 30})`);
          }

          if (capSecondary && secPts) {
            const pos2 = interpolateWaypoints(secPts, ease);
            capSecondary.setAttribute("transform", `translate(${pos2.x}, ${pos2.y - 30})`);
          }
        };

        if (instantEnd || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          placeAt(1);
          triggerArrivalPulse(step.to, step.tone);
          return;
        }

        const duration = Math.round(780 / state.speed);
        const startTime = performance.now();

        function tick(now) {
          const p = Math.min(1, (now - startTime) / duration);
          placeAt(p);
          if (p < 1) {
            state.rafId = requestAnimationFrame(tick);
          } else {
            state.rafId = null;
            triggerArrivalPulse(step.to, step.tone);
          }
        }
        state.rafId = requestAnimationFrame(tick);
      }

      function goToStep(idx, animate = true) {
        const scene = getScene();
        state.stepIdx = Math.max(0, Math.min(scene.steps.length - 1, idx));
        const step = scene.steps[state.stepIdx];

        els.stepBadge.className = `step-pill tabular tone-${step.tone}`;
        els.stepBadge.textContent = `步骤 ${state.stepIdx + 1} / ${scene.steps.length}`;
        els.stepTitle.textContent = step.title;
        els.stepDesc.textContent = step.desc;

        els.protoBadge.className = `proto-badge tone-${step.tone}`;
        els.protoBadge.textContent = step.proto;

        els.btnPrev.disabled = state.stepIdx === 0;
        els.btnNext.disabled = state.stepIdx === scene.steps.length - 1;

        renderInspector(step);
        updateScrubberState();
        updateTcpdumpHighlight();
        highlightLinkPath(step.from, step.to, step.tone);
        highlightActiveNode(step.to, step.tone);
        animatePacketForStep(step, !animate);
      }

      function scheduleNextAuto() {
        clearTimeout(state.timerId);
        if (!state.playing) return;
        const scene = getScene();
        if (state.stepIdx >= scene.steps.length - 1) {
          stopAutoPlay();
          return;
        }
        const interval = Math.round(2550 / state.speed);
        state.timerId = setTimeout(() => {
          if (!state.playing) return;
          goToStep(state.stepIdx + 1, true);
          scheduleNextAuto();
        }, interval);
      }

      function startAutoPlay() {
        const scene = getScene();
        if (state.stepIdx >= scene.steps.length - 1) {
          goToStep(0, true);
        }
        state.playing = true;
        els.playLabel.textContent = "暂停";
        els.playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        scheduleNextAuto();
      }

      function stopAutoPlay() {
        state.playing = false;
        clearTimeout(state.timerId);
        els.playLabel.textContent = "播放";
        els.playIcon.innerHTML = '<polygon points="6 4 20 12 6 20 6 4"></polygon>';
      }

      function switchScene(sceneId, initialStep = 0, shouldPlay = false) {
        if (!SCENES[sceneId]) return;
        stopAutoPlay();
        state.sceneId = sceneId;
        document.querySelectorAll(".scene-btn").forEach(btn => {
          btn.classList.toggle("active", btn.getAttribute("data-scene") === sceneId);
        });
        renderTopologyBase();
        renderScrubber();
        renderTcpdumpList();
        goToStep(initialStep, true);
        if (shouldPlay) startAutoPlay();
      }

      // Wire events
      document.querySelectorAll(".scene-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          switchScene(btn.getAttribute("data-scene"), 0, true);
        });
      });

      document.querySelectorAll(".speed-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.speed = parseFloat(btn.getAttribute("data-speed")) || 1;
          document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          if (state.playing) scheduleNextAuto();
        });
      });

      els.btnPlay.addEventListener("click", () => {
        if (state.playing) stopAutoPlay();
        else startAutoPlay();
      });

      els.btnPrev.addEventListener("click", () => {
        stopAutoPlay();
        goToStep(state.stepIdx - 1, true);
      });

      els.btnNext.addEventListener("click", () => {
        stopAutoPlay();
        goToStep(state.stepIdx + 1, true);
      });

      els.btnReplay.addEventListener("click", () => {
        stopAutoPlay();
        goToStep(0, true);
        startAutoPlay();
      });

      els.nodePopoverClose.addEventListener("click", closePopover);

      document.addEventListener("keydown", (e) => {
        if (e.target && ["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
        if (e.code === "Space") {
          e.preventDefault();
          if (state.playing) stopAutoPlay();
          else startAutoPlay();
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          stopAutoPlay();
          goToStep(state.stepIdx + 1, true);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          stopAutoPlay();
          goToStep(state.stepIdx - 1, true);
        }
      });

      // Read URL params for Hexo iframe deep linking (?scene=docker-tls-rst&step=8&autoplay=0)
      const params = new URLSearchParams(window.location.search);
      const paramScene = params.get("scene");
      const initialScene = SCENES[paramScene] ? paramScene : "routed";
      const stepParam = parseInt(params.get("step"), 10);
      const hasExplicitStep = !Number.isNaN(stepParam) && stepParam >= 1;
      const initialStep = hasExplicitStep ? stepParam - 1 : 0;
      const autoplayParam = params.get("autoplay");
      const shouldAutoPlay = autoplayParam === "1" || (!hasExplicitStep && autoplayParam !== "0");

      switchScene(initialScene, initialStep, shouldAutoPlay);
    })();
  </script>
</body>
</html>
